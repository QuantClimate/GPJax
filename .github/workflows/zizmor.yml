name: Audit GitHub Actions

# Static analysis of the repository's own CI: zizmor audits every workflow,
# composite action and dependabot.yml for supply-chain and privilege problems
# (unpinned actions, over-broad `permissions`, template injection, cache
# poisoning, dangerous triggers).
#
# Deliberately unfiltered on `pull_request`, matching security-analysis.yml: a
# `branches: [main]` filter would skip stacked PRs, which target their
# predecessor rather than `main`, so a whole stack could be reviewed and merged
# without its workflow changes ever being audited. Audit the code, not the
# target branch.
on:
  pull_request:
  push:
    branches:
      - main

# Read-only by default; the audit job grants itself the one write scope it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Audit workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout
      security-events: write # upload the SARIF report to code scanning
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Resolve zizmor from uv.lock rather than the network, for the same reason
      # ruff.yml does: a new zizmor release ships new audits, and `uvx
      # zizmor@latest` would turn every open PR red without a commit having been
      # made. Dependabot bumps the pin via the `uv` ecosystem.
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"
          enable-cache: true

      - name: Run zizmor
        # `--only-group dev` skips the JAX runtime stack and the project itself:
        # this job lints YAML and never imports gpjax. The flags must match on
        # every uv invocation in this job — a bare `uv run` would re-sync the
        # default groups and install all of JAX to run a linter.
        #
        # Deliberately NO `continue-on-error`. Under `--format sarif` zizmor
        # exits 0 even when it reports findings (unlike `plain`/`json`, which
        # exit 14) — the SARIF document is the report, and the exit code is
        # reserved for tool failure. So a non-zero exit here means zizmor itself
        # broke, which must fail the job; findings are gated on the report
        # contents in the last step instead.
        env:
          # Enables the online audits, which query the GitHub API to resolve
          # action refs. Without it those audits are skipped silently.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --frozen --only-group dev zizmor --format sarif . > results.sarif

      - name: Upload the SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        # Pull requests from forks get a read-only GITHUB_TOKEN, so the upload
        # is rejected there. That must not fail the audit — the findings still
        # appear in the step log below, and the gate step still blocks the PR.
        continue-on-error: true
        with:
          sarif_file: results.sarif
          category: zizmor

      - name: Fail if zizmor reported findings
        # The actual gate. Counts results in the SARIF rather than trusting the
        # exit code, which `--format sarif` always sets to 0 (see above).
        # Note the single quotes on the echo: the reproduction command contains
        # a `$(...)` that must reach the log as literal text, not be substituted
        # by this shell.
        run: |
          count=$(jq '[.runs[].results[]] | length' results.sarif)
          echo "zizmor reported $count finding(s)."
          if [ "$count" -gt 0 ]; then
            jq -r '.runs[].results[]
                   | "\(.locations[0].physicalLocation.artifactLocation.uri):"
                   + "\(.locations[0].physicalLocation.region.startLine) "
                   + "[\(.ruleId)] \(.message.text)"' results.sarif
            echo '::error::zizmor reported findings. Re-run locally with' \
                 '"GH_TOKEN=$(gh auth token) uv run poe lint-actions" for the' \
                 'annotated output, or open the Security tab for this run.'
            exit 1
          fi
