name: Test documentation

# Pull-request docs gate: the smoke half of impulso's `build-docs` conditional
# (../impulso/.github/workflows/main.yml). Fast render, warnings as errors.
on:
  pull_request:

# No `pages: write` / `id-token: write`: this workflow must never be able to
# touch GitHub Pages. See the artifact step below. `pull-requests: write` is
# only so the Netlify preview URL can be posted as a sticky comment.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test-docs:
    # Name must stay "Build docs" — it is a required status check in main's
    # branch protection, which matches on the job's display name.
    name: Build docs
    timeout-minutes: 45
    runs-on: ubuntu-latest
    # Job-level so the preview step's own `if` can test them: a step cannot see
    # env vars it declares itself.
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"
          enable-cache: true

      - name: Install docs dependencies
        run: uv sync --frozen --extra docs

      - name: Register Jupyter kernel
        run: uv run python -m ipykernel install --user --name python3 --display-name "Python 3"

      - name: Check the example kernelspecs are normalised
        # jupyter-cache keys on the whole `kernelspec` dict, `display_name`
        # included. Opening an example in Jupyter and re-saving rewrites that
        # field to the local venv's name, silently invalidating the notebook's
        # cache entry and forcing a re-execution against a 1800s timeout — from
        # a purely cosmetic header change. These are the values the "Register
        # Jupyter kernel" step above installs.
        # Both fields are checked: jupyter-cache hashes the whole kernelspec dict,
        # so a re-save that flips only `name` invalidates the cache just as surely
        # as one that flips only `display_name`.
        run: |
          bad=$(
            { grep -L '^#     display_name: Python 3$' docs/examples/*.py
              grep -L '^#     name: python3$'          docs/examples/*.py
            } | grep -v 'docs/examples/utils.py' | sort -u
          )
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "::error::The files above have a non-canonical kernelspec." \
                 "Set 'display_name: Python 3' and 'name: python3' in the jupytext header."
            exit 1
          fi

      - name: Restore notebook execution cache
        # Same accumulate-always cache as build_docs.yml: a unique key per run so
        # actions/cache always re-saves, with restore-keys picking up the newest
        # previous cache. Both directories are carried because the smoke and full
        # renders keep separate jupyter-cache stores.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            docs/_build/.jupyter_cache
            docs/_build/.jupyter_cache_ci
          key: jupyter-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            jupyter-cache-

      - name: Build documentation (smoke render, warnings as errors)
        run: uv run poe docs-ci

      - name: Resolve the Playwright version
        # The browser build is tied to the Python package version, so that is
        # what the cache must be keyed on. Re-downloading Chromium on every run
        # costs ~30s and a few hundred MB of bandwidth.
        id: playwright
        run: |
          echo "version=$(uv run --extra docs python -c 'from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium for Playwright
        # `--with-deps` installs the shared libraries Chromium needs on the
        # runner image; those are not covered by the cache above, so this step
        # runs on a cache hit too (it is a no-op for the browser itself).
        run: uv run --extra docs playwright install --with-deps chromium

      - name: Check MathJax rendering
        # Sphinx writes LaTeX into the HTML verbatim and MathJax parses it in
        # the browser, so the build above can be green while a page displays
        # "Erroneous nesting of equation structures" to every reader. This is
        # the only step that can see that. It must fail the job.
        run: uv run poe docs-check-math

      - name: Upload smoke-render artifact for PR review
        # Plain artifact, downloadable from the run page. NEVER a Pages
        # artifact, and never actions/deploy-pages: GitHub Pages "preview"
        # deployments are unsupported on this plan and silently deploy to the
        # production URL, so the job that used to live here was replacing the
        # published docs with a PR's smoke render.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs-smoke-render
          path: docs/_build/html
          retention-days: 7

      - name: Deploy Netlify preview
        # DIVERGENCE from impulso, which ships no PR preview at all. A branch
        # deploy on the same Netlify site that serves production: `--alias` puts
        # it at pr-<n>--<site>.netlify.app and, without `--prod`, cannot touch
        # the production deploy. Never add `--prod` to this step.
        #
        # Skipped on forks and until the secrets exist, so the gate above stays
        # green either way — a missing preview must not fail the docs build.
        id: netlify
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository
          && env.NETLIFY_AUTH_TOKEN != ''
        run: |
          npx --yes netlify-cli@latest deploy \
            --dir=docs/_build/html \
            --alias="pr-${{ github.event.number }}" \
            --message="PR #${{ github.event.number }} smoke render" \
            --json > netlify-deploy.json
          echo "url=$(jq -r '.deploy_url' netlify-deploy.json)" >> "$GITHUB_OUTPUT"

      - name: Comment the preview URL on the PR
        if: steps.netlify.outputs.url != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: docs-preview
          message: |
            📖 **Docs preview:** ${{ steps.netlify.outputs.url }}

            Smoke render — the expensive notebooks run with reduced budgets, so
            figures are not publication fidelity. `/render-mode.txt` says `smoke`.
