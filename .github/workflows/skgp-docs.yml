name: "skgp docs"

# Builds skgp's documentation for each pull request that can affect it, and
# deploys it to https://skgp.quantclimate.com on every push to main, as
# build_docs.yml does for GPJax's documentation. The build uses the GPJax code in the same commit,
# so `gpjax/**` is in the paths. A draft pull request is not built: check
# locally while the work is in progress.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skgp/docs/**"
      - "skgp/src/**"
      - "skgp/pyproject.toml"
      - "gpjax/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/skgp-docs.yml"
  # Every push to main deploys, as build_docs.yml does for GPJax's docs.
  push:
    branches:
      - main
  workflow_dispatch:

# Every job grants itself the narrowest scope it needs. The Cloudflare token is
# only in `deploy`, so the build, which imports the package, never runs with a
# credential that can publish.
permissions: {}

# A new push to a pull request, or to main, supersedes the run still going for
# the same pull request or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build the docs"
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Off, as in the release workflow: this build is deployed, so a
          # poisoned cache could reach the published site.
          enable-cache: false

      - name: Install the package and the docs dependencies
        run: |
          uv sync --frozen --package skgp --no-dev --group docs

      - name: Build the docs, failing on any warning
        run: |
          uv run --no-sync sphinx-build -W --keep-going -b html skgp/docs skgp/docs/_build/html

      - name: Upload the docs build
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs-html
          path: skgp/docs/_build/html
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: "Deploy the docs to Cloudflare"
    needs: build
    # A pull request's ref is never main, and a manual run from another branch
    # must never publish to the production URL.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout, for skgp/docs/wrangler.jsonc
    concurrency:
      group: cloudflare-skgp-docs
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the docs build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-html
          path: skgp/docs/_build/html

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Cloudflare serves the docs as the static assets of the `skgp-docs`
      # Worker (skgp/docs/wrangler.jsonc).
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.145.0 deploy --config skgp/docs/wrangler.jsonc
