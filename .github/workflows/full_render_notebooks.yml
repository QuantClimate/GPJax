name: Full Notebook Render

# Ported from impulso's ../impulso/.github/workflows/full-render-notebooks.yml.
# The PR gate renders notebooks in smoke mode, so nothing else exercises the
# example suite at full fidelity between deploys. This does, on a schedule, and
# opens an issue when it breaks.
on:
  schedule:
    - cron: '0 2 * * 0'  # Sunday 02:00 UTC
  workflow_dispatch:
  release:
    types: [published]

# Only the failure-reporting job files an issue. The render job itself, which
# executes every example notebook, runs with a read-only token.
permissions: {}

jobs:
  full-render:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    timeout-minutes: 90
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      # The three cache steps below carry `zizmor: ignore[cache-poisoning]`.
      # zizmor flags them because `release: published` makes this a publishing
      # workflow, and a cache written under a publishing event can be restored
      # by later runs. That is exactly what the guards prevent: caching is
      # switched off whenever the run was triggered by a release, so only the
      # scheduled and manual runs read or write the cache. zizmor evaluates the
      # workflow statically and cannot see through the expression.
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v7 # zizmor: ignore[cache-poisoning]
        with:
          version: "latest"
          enable-cache: ${{ github.event_name != 'release' }}

      - name: Install docs dependencies
        run: uv sync --frozen --extra docs

      - name: Register Jupyter kernel
        run: uv run python -m ipykernel install --user --name python3 --display-name "Python 3"

      - name: Restore notebook execution cache
        # Same accumulate-always cache as build_docs.yml: the Sunday full render
        # warms `.jupyter_cache`, so the next production deploy reuses real
        # figures instead of re-executing every notebook (or erroring out).
        if: github.event_name != 'release' # see the enable-cache note above
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: |
            docs/_build/.jupyter_cache
            docs/_build/.jupyter_cache_ci
          key: jupyter-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            jupyter-cache-

      - name: Full render (all example notebooks, warnings as errors)
        run: uv run --extra docs sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Resolve the Playwright version
        id: playwright
        run: |
          echo "version=$(uv run --extra docs python -c 'from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browser cache
        if: github.event_name != 'release' # see the enable-cache note above
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium for Playwright
        run: uv run --extra docs playwright install --with-deps chromium

      - name: Check MathJax rendering
        # The full render is the only build that produces every notebook page at
        # real fidelity, so it is also the only place the whole site's maths gets
        # checked. Deliberately NOT added to build_docs.yml: that path is
        # resilient by design and must never block a deploy.
        run: uv run poe docs-check-math

      - name: Check external links
        # The `docs-linkcheck` task existed but nothing invoked it. It runs with
        # `nb_execution_mode=off`, so it costs no notebook time. Non-gating: link
        # rot is somebody else's site changing, which must not retroactively fail
        # a green release. `continue-on-error` alone is what we want: the step is
        # annotated as failed in the UI so it is visible, but the job stays green.
        # Do NOT also add `|| true` — that would make the step unconditionally
        # succeed and the annotation would never appear.
        run: uv run poe docs-linkcheck
        continue-on-error: true

      - name: Upload the link-check report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs-linkcheck
          path: docs/_build/linkcheck
          retention-days: 30

  open-issue-on-failure:
    runs-on: ubuntu-latest
    needs: full-render
    permissions:
      issues: write # open the failure report
    if: failure()
    steps:
      - name: Open GitHub issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = `Notebook full render failed (${context.runNumber})`;
            const body = [
              '## Full notebook render failed',
              '',
              `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `**Trigger:** ${context.eventName}`,
              `**Date:** ${new Date().toISOString().split('T')[0]}`,
              '',
              'One or more example notebooks failed to render at full fidelity.',
              'Check the workflow logs for details.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ci', 'examples'],
            });
